#screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#000;direction:rtl;isolation:isolate;user-select:none;-webkit-user-select:none}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:95;pointer-events:none}
.land #island{display:none}
body.fill{padding-left:0;padding-right:0}

/* wallpaper */
#wall{background-color:#1a1024;position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
#wall::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200' preserveAspectRatio='none'><path d='M0 120 C60 80 110 90 160 110 S260 60 320 85 S380 100 400 90 V200 H0Z' fill='%23000' fill-opacity='.28'/><path d='M0 160 C70 120 140 140 200 150 S320 110 400 135 V200 H0Z' fill='%23000' fill-opacity='.38'/></svg>") bottom/100% 100% no-repeat}
#wall.photo::after{display:none}

/* status bar */
#status{position:absolute;top:0;inset-inline:0;height:54px;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:14px 34px 0;font-weight:600;font-size:15px;pointer-events:none;color:#fff;transition:color .2s,opacity .2s}
.land #status{height:34px;padding:6px 26px 0}
#status.dark{color:#111}
#status.hide{opacity:0}
#status .r{display:flex;gap:6px;align-items:center;direction:ltr}
#status svg{display:block}
#status .plane{display:none}
#status.air .plane{display:block}
#status .noserv{font-size:12px;font-weight:500;display:none}
#status.nocell .noserv{display:inline}
#status.nocell .bars{opacity:.3}

#clockTxt{font-variant-numeric:tabular-nums;direction:ltr}
#pull{position:absolute;top:0;inset-inline:0;height:44px;z-index:61;cursor:pointer;touch-action:none}
#pull.thin{height:18px;inset-inline:35%}
#pull.thin::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:60px;height:4px;border-radius:2px;background:rgba(255,255,255,.55)}

/* home */
#home{position:absolute;inset:0;z-index:1;padding:66px 22px 0;display:flex;flex-direction:column;transition:transform .35s ease,filter .35s,opacity .35s}
.land #home{padding:44px 40px 0;flex-direction:row;gap:20px}
#home.behind{transform:scale(.92);filter:blur(6px);opacity:.6}
.widget{border-radius:24px;padding:16px 18px;background:rgba(15,15,20,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none}
.land .widget{flex-direction:column;align-items:flex-start;justify-content:flex-start;width:190px;align-self:flex-start}
.widget .t{font-family:var(--f-display);font-size:58px;line-height:1;letter-spacing:.5px;direction:ltr}
.widget .d{text-align:start;font-size:13px;color:rgba(255,255,255,.82);line-height:1.6}
.widget .d b{display:block;font-size:15px;color:#fff;font-weight:600}
.gridWrap{flex:1;min-height:0;overflow-y:auto;margin-top:20px;scrollbar-width:none}
.land .gridWrap{margin-top:0;padding-top:4px}
.gridWrap::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;align-content:start;padding-bottom:12px}
.land .grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);position:relative;min-width:0}
.ic>span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic .ico{width:62px;height:62px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ic:active .ico{transform:scale(.9);filter:brightness(.8)}
.ico{display:grid;place-items:center;overflow:hidden;position:relative;flex:none}
.ico svg{width:58%;height:58%}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico .emo{font-size:34px;line-height:1}
.ico .load{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center}
.ico .lockb{position:absolute;bottom:3px;left:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.ico .lockb svg{width:12px;height:12px}
.hint{grid-column:1/-1;border-radius:20px;padding:14px 16px;background:rgba(15,15,20,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,.9);text-align:start}
.hint b{color:#fff}
.dock{flex:none;margin-bottom:30px;padding:14px 16px;border-radius:32px;background:rgba(255,255,255,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.land .dock{margin:0 0 20px;align-self:flex-end;grid-template-columns:1fr;padding:12px 10px}
.dock .ic>span{display:none}

/* app windows */
#apps{position:absolute;inset:0;z-index:20;pointer-events:none}
.app{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;
  transform:scale(.88);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}
.app.open{transform:none;opacity:1;pointer-events:auto}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:inherit;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.page.in{transform:translateX(-100%)}
.page.under{transform:translateX(25%)}
.bar{padding:58px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;min-height:100px}
.land .bar{padding-top:38px;min-height:0}
.bar h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15}

.body{flex:1;overflow-y:auto;padding:0 18px 40px;min-height:0}
.kbon .body{padding-bottom:300px}
.lnk{color:var(--accent);font-size:16px;padding:6px 4px;white-space:nowrap}

#homebar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:160px;height:26px;z-index:96;display:grid;place-items:center;touch-action:none}

.empty{padding:30px 20px;text-align:center;color:var(--mute);line-height:1.8;font-size:14px}

/* shared controls */
.btn{padding:11px 16px;border-radius:12px;background:var(--surface3);font-weight:500;text-align:center}
.btn.red{background:var(--danger);color:#fff}
.btn.acc{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.blue{background:var(--blue);color:#fff;font-weight:600}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.45}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--surface3);color:var(--ink);font-size:16px;outline:none}

.group{background:var(--surface2);border-radius:14px;overflow:hidden;margin-bottom:22px}
.ghead{font-size:12.5px;color:var(--mute);margin:0 6px 7px;letter-spacing:.2px}

.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px;width:100%;text-align:start;min-height:48px}
.srow:first-child{border-top:0}

.srow .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .v{color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.srow .chev::after{content:"‹";font-size:20px;color:var(--faint);line-height:1}
.sico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.sico svg{width:18px;height:18px}
.tog{width:51px;height:31px;border-radius:16px;background:#3a3d46;position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tog.on{background:var(--good)}
.tog.on::after{transform:translateX(-20px)}
.check{color:var(--blue);font-size:18px}
.range{width:100%;accent-color:var(--accent)}
.dlg{position:absolute;inset:0;z-index:92;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:30px}
.dlg .box{background:var(--surface2);border-radius:18px;padding:20px;width:100%;max-width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}

#toast{position:absolute;top:60px;left:50%;transform:translate(-50%,-20px);z-index:93;background:rgba(30,32,38,.95);padding:10px 18px;border-radius:20px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:93;width:150px;padding:18px;border-radius:22px;background:rgba(30,32,38,.9);
  display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:14px}

#hud .meter{width:100%;height:6px;border-radius:3px;background:#444;overflow:hidden;direction:ltr}

#dim{position:absolute;inset:0;background:#000;z-index:99;pointer-events:none;opacity:0}

/* control center */
#cc{position:absolute;inset:0;z-index:70;background:rgba(10,10,14,.45);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  padding:64px 24px 40px;opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto}

.cct{background:rgba(255,255,255,.12);border-radius:20px;aspect-ratio:1;display:grid;place-items:center;position:relative;max-width:100%}

/* keyboard */
#kb{position:absolute;bottom:0;inset-inline:0;z-index:94;background:rgba(40,42,48,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:8px 4px 34px;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);direction:ltr;touch-action:manipulation}

.kr{display:flex;gap:5px;justify-content:center;margin-bottom:9px}

#lockPad{position:absolute;inset:0;background:rgba(10,10,14,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;padding:90px 20px 30px;gap:10px}

.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px;direction:ltr}

.pk{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}

.pk.txt{background:none;font-size:15px}
.patt{width:270px;height:270px;touch-action:none;display:block;max-width:100%}

.lockLinks{display:flex;gap:30px;margin-top:auto;font-size:15px;color:#fff}

#setup{position:absolute;inset:0;z-index:89;background:#0d0e12;display:flex;flex-direction:column}

.swb{display:flex;justify-content:space-between;padding:0 10px}
.round{width:80px;height:80px;border-radius:50%;background:#333;font-size:15px}
.round.go{background:#0b3a1c;color:var(--good)}
.round.stop{background:#3d1210;color:var(--danger)}
.laps{margin-top:20px;font-variant-numeric:tabular-nums}
.laps div{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.laps div span:last-child{direction:ltr}

/* settings */
#app-settings{background:#0f1013}
.acct{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:start}
.acct .av{width:58px;height:58px;font-size:30px}
.acct b{display:block;font-size:18px;font-weight:600}
.acct span{font-size:13px;color:var(--mute)}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 16px}
.wopt{aspect-ratio:9/16;border-radius:10px;border:2px solid transparent;max-width:100%;background-size:cover;background-position:center}
.wopt.on{border-color:var(--accent)}
.bigav{width:96px;height:96px;font-size:50px;margin:0 auto 10px}
.usage{direction:ltr;font-variant-numeric:tabular-nums}

/* avatars */
.av{border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:100%;height:100%}

/* store */
#app-souq{background:#0e0f12}
.eyebrow{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.4px}
.today{font-size:14px;color:var(--mute)}
.feat{display:block;position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;margin:14px 0 26px;background:#222;text-align:start;width:100%;max-width:100%}
.land .feat{aspect-ratio:16/7}
.feat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 35%,transparent 55%,rgba(0,0,0,.85) 100%)}
.feat .top{position:absolute;top:18px;inset-inline:18px}
.feat .top .eyebrow{color:#ffd28a}
.feat .top h2{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.25;color:#fff;text-wrap:balance}
.feat .bot{position:absolute;bottom:0;inset-inline:0;padding:14px 16px;display:flex;align-items:center;gap:12px;background:rgba(20,16,10,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.feat .bot .ico{width:48px;height:48px;border-radius:12px}
.feat .bot .meta{flex:1;min-width:0;color:#fff}
.feat .bot .meta b{display:block;font-size:15px}
.feat .bot .meta span{font-size:12px;color:rgba(255,255,255,.75)}
.maker{border-radius:22px;padding:18px;margin:6px 0 24px;background:linear-gradient(150deg,#2b1d0d,#1a1410 60%,#14161b);border:1px solid rgba(233,162,59,.25)}
.maker h2{margin:2px 0 4px;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2;color:#ffd28a}
.maker p{margin:0 0 12px;font-size:13.5px;color:#cfc6b6;line-height:1.7}
.maker .row{border:0;padding:0;margin-top:10px}
.mkprog{margin-top:12px;font-size:13.5px;color:#e8dcc8;line-height:1.7}
.mkbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.mkbar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:3px;animation:mk 1.3s ease-in-out infinite}
@keyframes mk{0%{transform:translateX(250%)}100%{transform:translateX(-120%)}}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px}
.sec h2{margin:0;font-size:21px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.row:last-child{border-bottom:0}
.row .ico{width:60px;height:60px;border-radius:14px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{font-size:12.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{min-width:74px;height:30px;border-radius:15px;background:var(--surface3);color:var(--blue);font-weight:700;font-size:14px;padding:0 14px;display:inline-grid;place-items:center;flex:none}
.get.big{height:34px;min-width:90px;background:var(--blue);color:#fff;border-radius:17px}
.get.big.open{background:var(--surface3);color:var(--blue)}
.get.prog{background:none;padding:0;min-width:74px}
.tabs{position:absolute;bottom:0;inset-inline:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px 30px;
  background:rgba(14,15,18,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.land .tabs{padding-bottom:10px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint)}
.tabs button.on{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.dhead{display:flex;gap:14px;align-items:flex-start;margin-top:8px}
.dhead .ico{width:110px;height:110px;border-radius:24px}
.dhead h2{margin:4px 0 2px;font-size:22px;font-weight:600;text-wrap:balance}
.dhead p{margin:0 0 12px;color:var(--mute);font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.facts div{text-align:center;border-inline-start:1px solid var(--line);padding:0 4px;min-width:0}
.facts div:first-child{border-inline-start:0}
.facts small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.3px}
.facts b{display:block;font-size:15px;margin:3px 0 1px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts span{font-size:10.5px;color:var(--faint)}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px}
.shots img,.shots .fake{flex:none;width:270px;max-width:80%;aspect-ratio:16/9;border-radius:14px;object-fit:cover;scroll-snap-align:start;border:1px solid var(--line)}
.desc{color:#d8d5ce;font-size:14.5px;line-height:1.9;margin:18px 0}
.needs{border-radius:14px;background:rgba(76,147,255,.1);border:1px solid rgba(76,147,255,.3);padding:12px 14px;font-size:13.5px;line-height:1.7;color:#cfe0ff;margin:14px 0}
.danger{color:var(--danger);font-size:15px;padding:12px 0;width:100%;text-align:start;border-top:1px solid var(--line)}

/* hajwala + game runner */
#app-hajwala{background:#120d08;color:#fff}
.hero{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(2px) brightness(.45)}
.hin{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 26px 50px;text-align:center}
.land .hin{padding:30px 26px}
.hin .ico{width:110px;height:110px;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.land .hin .ico{width:70px;height:70px;border-radius:18px}
.hin h2{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1}
.hin p{margin:0;color:rgba(255,255,255,.85);font-size:14px;line-height:1.8;max-width:32ch}
.play{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:14px 34px;border-radius:30px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;box-shadow:0 8px 30px rgba(233,162,59,.4)}
.rotcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 18px;border-radius:18px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);max-width:300px}
.rotcard .steps{text-align:start;font-size:14px;line-height:1.9;color:#fff}
.rotcard .steps b{color:#ffd28a}
.uparrow{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;color:#ffd28a;animation:bob 1.4s ease-in-out infinite}
.gframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:4}
.gx{position:absolute;top:10px;left:12px;z-index:6;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.land .gx{top:40px}

/* mini games */
#app-snake,#app-xo,#app-tasbeeh{background:#0d1210}
.score{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);margin-bottom:10px}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}
.snakeC{width:100%;aspect-ratio:1;border-radius:16px;background:#12201a;display:block;touch-action:none;max-width:100%}
.land .snakeC{width:auto;height:calc(100% - 30px);margin:0 auto}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:16px;direction:ltr}
.pad button{background:var(--surface3);border-radius:14px;font-size:22px}
.pad .u{grid-column:2}
.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
#app-xo{background:#14101c}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto 20px;direction:ltr;max-width:340px}
.xoc{aspect-ratio:1;border-radius:16px;background:#221b2e;font-size:56px;font-weight:700;max-width:100%}
.xoc.x{color:#ff8a5c}.xoc.o{color:#8fb8ff}
.xostat{text-align:center;font-size:18px;min-height:28px}
#app-tasbeeh{background:#0b1514}
.bead{width:230px;max-width:80%;aspect-ratio:1;border-radius:50%;margin:30px auto 18px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#2fb59a,#0f5e50 60%,#083a32);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 -10px 30px rgba(0,0,0,.35)}
.land .bead{width:150px;margin:6px auto}
.bead b{font-size:84px;font-weight:300;font-variant-numeric:tabular-nums;color:#e9fff9}
.bead:active{transform:scale(.97)}
.phrase{text-align:center;font-family:var(--f-display);font-size:34px;color:#bff3e6}
.tot{text-align:center;color:var(--mute);margin-top:6px}

/* camera */
#app-camera{background:#000}
.camvf{flex:1;margin:96px 0 0;background:radial-gradient(circle at 50% 45%,#1d2027,#050506 70%);display:grid;place-items:center;position:relative;color:var(--mute);text-align:center;font-size:14px;line-height:1.8;padding:20px;overflow:hidden}
.land .camvf{margin-top:30px}
.camvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camgrid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.12) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.12) 66.6%,transparent 66.9%),linear-gradient(transparent 33%,rgba(255,255,255,.12) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.12) 66.6%,transparent 66.9%);pointer-events:none}
.cammodes{display:flex;justify-content:center;gap:22px;font-size:13px;color:var(--mute);padding:14px 0 6px;letter-spacing:.5px}
.cammodes b{color:#ffd60a;font-weight:600}
.camctl{display:flex;align-items:center;justify-content:space-between;padding:10px 34px 46px}
.land .camctl{padding-bottom:12px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter::after{content:"";width:62px;height:62px;border-radius:50%;background:#fff}
.shutter:active::after{transform:scale(.9)}
.shutter.recording::after{width:30px;height:30px;border-radius:8px;background:#ff3b30}
.camthumb{width:50px;height:50px;border-radius:10px;background:var(--surface3);overflow:hidden}
.camthumb img{width:100%;height:100%;object-fit:cover}
.camflip{width:50px;height:50px;border-radius:50%;background:var(--surface3);display:grid;place-items:center}

/* photos / files */
#app-photos{background:#000}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -18px}
.land .pgrid{grid-template-columns:repeat(6,1fr)}
.pgrid button{aspect-ratio:1;background:#222;overflow:hidden;max-width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:absolute;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.viewer .vimg{flex:1;min-height:0;display:grid;place-items:center;padding:0}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vbar{display:flex;justify-content:space-around;padding:14px 10px 40px;flex:none}
.land .vbar{padding-bottom:12px}
.vbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--blue)}
.vbar button.red{color:var(--danger)}
.vbar svg{width:24px;height:24px}
#app-files{background:#0f1013}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.frow .fi{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--surface3)}
.frow .fi img{width:100%;height:100%;object-fit:cover}
.frow .fi svg{width:24px;height:24px}
.frow .meta{flex:1;min-width:0}
.frow b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.frow span{font-size:12px;color:var(--mute)}
.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.folder{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--surface2);font-size:13px}
.folder.on{outline:2px solid var(--blue)}
.folder svg{width:40px;height:34px}
.textview{white-space:pre-wrap;font-size:14px;line-height:1.7;direction:auto;background:var(--surface2);border-radius:12px;padding:14px;overflow-wrap:anywhere}

/* phone app */
#app-phone{background:#0d0e12}
.pcta{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 10px}
.pcta p{margin:0;color:var(--mute);line-height:1.8;font-size:14.5px}
.wsteps{display:flex;gap:6px;justify-content:center;margin:4px 0 18px;direction:rtl}
.wsteps i{width:28px;height:4px;border-radius:2px;background:var(--surface3)}
.wsteps i.on{background:var(--blue)}
.wq{font-size:20px;font-weight:600;margin:0 0 6px;text-align:center}
.wsub{color:var(--mute);font-size:13.5px;text-align:center;margin:0 0 18px;line-height:1.6}
.gchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gchoice .choice{flex-direction:column;text-align:center;padding:20px 10px}
.avopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.avopts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.avopts .av{width:60px;height:60px}
.avopts button.on .av{outline:3px solid var(--blue);outline-offset:2px}
.animals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.animals button .av{width:64px;height:64px;font-size:36px;margin:0 auto}
.animals button.on .av{outline:3px solid var(--blue);outline-offset:2px}
.mycard{border-radius:20px;padding:20px;background:linear-gradient(150deg,#232a3d,#16181f);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:20px}
.mycard .av{width:90px;height:90px;font-size:48px}
.mycard b{font-size:22px;font-weight:600}
.mycard .num{font-size:22px;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#cfe0ff}
.crow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.crow .av{width:42px;height:42px;font-size:22px}
.crow b{font-size:15px;font-weight:500;display:block}
.crow span{font-size:12.5px;color:var(--mute);direction:ltr;display:block;text-align:start}
.dial{font-size:36px;text-align:center;min-height:56px;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:10px 0 16px;overflow:hidden;white-space:nowrap}
.dpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 26px;justify-content:center;direction:ltr}
.land .dpad{grid-template-columns:repeat(6,52px);gap:6px 12px}
.dk{width:72px;height:72px;border-radius:50%;background:var(--surface3);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.land .dk{width:52px;height:52px;font-size:22px}
.dk small{font-size:9px;letter-spacing:2px;color:var(--mute);margin-top:2px}
.dcall{grid-column:2;background:var(--good);color:#fff}
.land .dcall{grid-column:auto}
.call{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,#2a3247,#0e1119);display:flex;flex-direction:column;align-items:center;padding:100px 20px 60px;text-align:center}
.land .call{padding-top:40px}
.call .av{width:110px;height:110px;font-size:58px;margin-bottom:12px}
.call b{font-size:28px;font-weight:600}
.call .st{color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.call .endc{margin-top:auto;width:76px;height:76px;border-radius:50%;background:var(--danger);display:grid;place-items:center}

/* browser */
#app-browser{background:#f7f7f9;color:#1d1d22}
#app-browser .body{color:#1d1d22}
.bhome{display:flex;flex-direction:column;align-items:center;padding-top:30px;gap:20px}
.blogo{font-family:var(--f-display);font-size:58px;line-height:1;letter-spacing:1px}
.blogo span:nth-child(1){color:#e8572a}.blogo span:nth-child(2){color:#1f8a70}.blogo span:nth-child(3){color:#2f6fe0}.blogo span:nth-child(4){color:#e9a23b}
.bsearch{display:flex;align-items:center;gap:8px;width:100%;border-radius:26px;background:#fff;border:1px solid #dcdce2;padding:4px 6px 4px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bsearch input{flex:1;border:0;background:none;outline:none;font-size:16px;color:#1d1d22;padding:9px 4px;min-width:0}
.bsearch button{width:36px;height:36px;border-radius:50%;background:#2f6fe0;color:#fff;display:grid;place-items:center;flex:none}
.bchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bchips button{padding:7px 14px;border-radius:16px;background:#ececf1;font-size:13px;color:#333}
.bbar{display:flex;align-items:center;gap:8px;padding:56px 12px 10px;flex:none;background:#f7f7f9;border-bottom:1px solid #e3e3e8}
.land .bbar{padding-top:34px}
.bbar .bsearch{box-shadow:none;padding:2px 4px 2px 12px}
.bbar .bsearch input{padding:7px 2px;font-size:15px}
.bnav{display:flex;justify-content:space-around;padding:10px 0 34px;flex:none;background:#f7f7f9;border-top:1px solid #e3e3e8}
.land .bnav{padding-bottom:8px}
.bnav button{color:#2f6fe0;width:44px;height:30px;display:grid;place-items:center}
.bnav button:disabled{color:#bbb}
.bnav svg{width:22px;height:22px}
.aio{border-radius:16px;background:#fff;border:1px solid #e3e3e8;padding:14px 16px;margin:14px 0;font-size:14.5px;line-height:1.8;color:#25252b}
.aio .h{font-size:12px;color:#7a62d6;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.res{padding:12px 0;border-bottom:1px solid #e6e6ea;width:100%;text-align:start;display:block}
.res .u{font-size:12px;color:#5f6368;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res b{display:block;font-size:17px;font-weight:500;color:#1a4fd0;margin:2px 0}
.res span{font-size:13.5px;color:#4d5156;line-height:1.6;display:block}
.bpage h1{font-size:24px;line-height:1.4;margin:16px 0 6px;color:#1d1d22}
.bpage .src{font-size:12px;color:#5f6368;direction:ltr;text-align:start;margin-bottom:12px}
.bpage .art{font-size:15.5px;line-height:1.9;color:#2a2a30;white-space:pre-wrap}
.bpage .tag{display:inline-block;font-size:11.5px;background:#efeaff;color:#5a3fd0;padding:3px 10px;border-radius:10px;margin-top:6px}
.realbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0;padding:12px;border-radius:12px;background:#1d1d22;color:#fff;text-decoration:none;font-weight:500}
.offline{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 20px;text-align:center;color:#666;line-height:1.7}

/* video app */
#app-video{background:#0f0f0f}
.vres{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.vres .th{width:120px;aspect-ratio:16/9;border-radius:10px;flex:none;display:grid;place-items:center;font-size:30px}
.vres b{font-size:14.5px;display:block;line-height:1.5}
.vres span{font-size:12px;color:var(--mute)}

/* studio */
#app-studio{background:#120f17}
.cover{width:160px;height:160px;border-radius:34px;margin:6px auto 14px;overflow:hidden;background:var(--surface3);display:grid;place-items:center;font-size:70px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.cover img{width:100%;height:100%;object-fit:cover}
.srcopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.srcopts button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;background:var(--surface2);font-size:13.5px}
.srcopts svg{width:28px;height:28px}
#app-runner{background:#0b0d12}
#app-ugame{background:#000}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* status 5G */
#status .ctype{display:none;font-size:12.5px;font-weight:700;letter-spacing:.3px}
#status.c5g .ctype{display:inline}

/* notifications */
.notif{position:absolute;top:50px;inset-inline:10px;z-index:98;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:20px;
  background:rgba(40,42,48,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.land .notif{top:30px;inset-inline:20%}
.notif.on{transform:none}
.notif .nt{flex:1;min-width:0}
.notif .nt b{display:block;font-size:13.5px}
.notif .nt span{display:block;font-size:13.5px;color:#e6e3dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .na{display:flex;gap:8px;width:100%}
.notif .na .btn{flex:1;padding:9px}
.btn.green{background:var(--good);color:#fff;font-weight:600}

/* bank */
.bankcard{border-radius:22px;padding:18px 20px;background:linear-gradient(135deg,#0f8f6b,#06463a 70%);box-shadow:0 14px 30px rgba(0,0,0,.35);position:relative;overflow:hidden}
.bankcard::after{content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.bk1{font-size:13px;color:rgba(255,255,255,.75)}
.bkbal{font-family:var(--f-display);font-size:42px;line-height:1.2;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.bk2{font-size:13px;letter-spacing:1.5px;color:rgba(255,255,255,.8);text-align:start}
.bk3{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}
.bkact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bkact button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;padding:12px 4px;border-radius:16px;background:var(--surface2)}
.bkact button span{width:38px;height:38px;border-radius:50%;background:rgba(15,143,107,.25);color:#5fe0b4;display:grid;place-items:center;font-size:18px;font-weight:700}
.bkact svg{width:20px;height:20px}
.amts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.amts button{padding:16px 10px;border-radius:14px;background:var(--surface2);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* recharge app */
.netnow{border-radius:14px;padding:12px 14px;background:var(--surface2);color:var(--mute);font-size:14px;margin-bottom:14px;line-height:1.6}
.netnow.on{background:rgba(63,199,122,.12);color:#9fe8bd}
.netnow b{color:#fff}
.pkg{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;margin-bottom:10px;background:linear-gradient(135deg,hsl(var(--h) 70% 30%),hsl(var(--h) 60% 18%))}
.pkg>div:first-child{flex:1;min-width:0}
.pkg b{display:block;font-size:17px}
.pkg span{font-size:12.5px;color:rgba(255,255,255,.75)}
.pkg .pp{font-weight:700;font-size:15px;white-space:nowrap}
.codebox{font-size:30px;letter-spacing:3px;font-variant-numeric:tabular-nums;padding:18px;border-radius:16px;background:var(--surface2);border:1px dashed rgba(255,255,255,.25);user-select:all;-webkit-user-select:all}

/* real calls */
.call.live{padding-top:70px;gap:4px}
.land .call.live{padding-top:30px}
.call.live .av{width:84px;height:84px;font-size:44px;margin-bottom:6px}
.land .call.live .av{width:52px;height:52px;font-size:28px}
.cchat{flex:1;width:100%;max-width:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:14px 0 8px;padding:6px 2px;min-height:0}
.cm{max-width:80%;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.12);font-size:15px;line-height:1.5;align-self:flex-end;text-align:start;overflow-wrap:anywhere}
.cm.me{align-self:flex-start;background:#2f7d4f}
.cm.sys{align-self:center;background:none;color:var(--mute);font-size:13px;text-align:center;max-width:95%}
.cin{display:flex;gap:8px;width:100%;max-width:420px}
.cin .field{flex:1;min-width:0;padding:10px 12px}
.cbtns{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:auto;padding-top:12px}
.cbtns.two{gap:80px}
.cbtns button[data-spk]{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;opacity:.5}
.cbtns button[data-spk] span{font-size:11px}
.cbtns button[data-spk].on{opacity:1}
.call .endc.ans{background:var(--good)}
.call .cbtns .endc{margin-top:0}
.ondot{width:10px;height:10px;border-radius:50%;background:var(--good);margin-inline-start:auto;flex:none;box-shadow:0 0 0 3px rgba(63,199,122,.25)}

/* video */
.vcard{display:block;width:100%;text-align:start;margin-bottom:16px}
.vcard video{width:100%;aspect-ratio:16/9;border-radius:14px;background:#222;object-fit:cover;display:block;margin-bottom:8px;max-width:100%}
.vcard b{display:block;font-size:15px}
.vcard span{font-size:12.5px;color:var(--mute)}
.vplayer{width:100%;aspect-ratio:16/9;background:#000;display:block;flex:none;max-width:100%}
.land .vplayer{aspect-ratio:auto;height:55%}

/* letters */
.lstar{font-size:15px;color:#ffd28a;font-variant-numeric:tabular-nums}
.lmenu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.land .lmenu{grid-template-columns:repeat(4,1fr)}
.lmenu button{border-radius:22px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:150px;justify-content:center}
.lmenu span{font-family:var(--f-display);font-size:44px;line-height:1.2}
.lmenu b{font-size:16px}
.lmenu small{font-size:12px;opacity:.85}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:rtl}
.land .lgrid{grid-template-columns:repeat(7,1fr)}
.lgrid button{aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,#ff9f43,#e0336b);font-family:var(--f-display);font-size:40px;max-width:100%}
.lbig{width:170px;height:170px;border-radius:40px;background:linear-gradient(160deg,#ff9f43,#e0336b);font-family:var(--f-display);font-size:110px;line-height:1;margin:6px auto 4px;display:grid;place-items:center;box-shadow:0 14px 30px rgba(224,51,107,.35)}
.land .lbig{width:110px;height:110px;font-size:70px}
.lname{font-size:24px;font-weight:600;margin-bottom:8px}
.lforms{display:flex;justify-content:center;gap:18px;font-family:var(--f-display);font-size:34px;color:#ffd28a;margin-bottom:12px}
.lex{display:flex;align-items:center;gap:14px;justify-content:center;width:100%;padding:12px;border-radius:18px;background:var(--surface2)}
.lex span{font-size:48px}
.lex b{font-family:var(--f-display);font-size:34px;font-weight:400}
.lex u{color:#ff9f43;text-decoration:none}
.qhead{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:12px}
.lspeak{display:block;margin:20px auto 0;padding:18px 26px;border-radius:20px;background:linear-gradient(160deg,#4c93ff,#5b3fd0);font-size:20px}
.lpic{display:block;margin:4px auto 0;font-size:96px;line-height:1.1;background:var(--surface2);border-radius:28px;padding:10px 28px}
.land .lpic{font-size:60px}
.qopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;direction:rtl}
.qopts.three{grid-template-columns:repeat(3,1fr)}
.land .qopts{grid-template-columns:repeat(4,1fr)}
.qopts button{padding:14px 0;border-radius:20px;background:var(--surface2);font-family:var(--f-display);font-size:46px;line-height:1.2;transition:background .2s}
.qopts button.ok{background:var(--good)}
.qopts button.no{background:var(--danger)}
.slots{display:flex;justify-content:center;gap:8px;margin:18px 0;direction:rtl}
.slots span{width:54px;height:62px;border-radius:14px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--f-display);font-size:38px}
.slots span.f{border-style:solid;border-color:var(--good);background:rgba(63,199,122,.15)}
#app-bank{background:#0c1412}#app-shahno{background:#110c1c}#app-letters{background:#1a0f14}#app-tara{background:#1a0d05;color:#fff}

.ico.s30{width:30px!important;height:30px!important;border-radius:8px!important}.ico.s38{width:38px!important;height:38px!important;border-radius:10px!important}.ico.s40{width:40px!important;height:40px!important;border-radius:10px!important}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:conf 1.4s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes conf{to{top:105%;opacity:.2}}
.lhint{text-align:center;font-size:11.5px;color:var(--faint);margin-top:8px}

#status.realoff .wifi{opacity:.3}
.netnow.bad{background:rgba(255,93,82,.12);color:#ffb3ad}

</style>
</head>

/* ---- IndexedDB key/value with memory fallback ---- */
const IDB=(()=>{let dbp=null;const mem=new Map();
  function open(){if(dbp)return dbp;dbp=new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),2500);
    try{const r=indexedDB.open('jawwal',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>fin(r.result);r.onerror=()=>fin(null);r.onblocked=()=>fin(null)}catch(e){fin(null)}});return dbp}
  async function run(mode,fn){const db=await open();if(!db)return {ok:false};return new Promise(res=>{try{const t=db.transaction('kv',mode);const req=fn(t.objectStore('kv'));t.oncomplete=()=>res({ok:true,v:req&&req.result});t.onerror=t.onabort=()=>res({ok:false})}catch(e){res({ok:false})}})}
  /* Blobs are stored as raw bytes: some browsers lose Blob contents stored in IndexedDB after the page reloads */
  async function pack(v){if(v&&typeof v==='object'&&v.blob instanceof Blob){const buf=await v.blob.arrayBuffer();const o={...v,buf,btype:v.blob.type||v.type||''};delete o.blob;return o}return v}
  async function unpack(v){if(v&&typeof v==='object'){if(v.buf){return{...v,blob:new Blob([v.buf],{type:v.btype||v.type||''})}}
    if(v.blob instanceof Blob){try{await v.blob.slice(0,4).arrayBuffer();return v}catch(e){return undefined}}}return v}
  return{
    async get(k){if(mem.has(k))return mem.get(k);const r=await run('readonly',s=>s.get(k));if(!r.ok)return undefined;const v=await unpack(r.v);if(v!==undefined)mem.set(k,v);return v},
    async set(k,v){mem.set(k,v);const p=await pack(v);await run('readwrite',s=>s.put(p,k))},
    async del(k){mem.delete(k);await run('readwrite',s=>s.delete(k))},
    async clear(){mem.clear();await run('readwrite',s=>s.clear())}
  }})();
const URLS=new Map();
async function blobURL(key){if(URLS.has(key))return URLS.get(key);const v=await IDB.get(key);if(!v||!v.blob)return null;const u=URL.createObjectURL(v.blob);URLS.set(key,u);return u}

/* local pointer coordinates that respect the rotated screen */
function lpt(e,el){const r=el.getBoundingClientRect();const p=e.touches?e.touches[0]||e.changedTouches[0]:e;
  if(ROT())return{x:p.clientY-r.top,y:r.right-p.clientX,w:r.height,h:r.width};
  return{x:p.clientX-r.left,y:p.clientY-r.top,w:r.width,h:r.height}}

/* ---- sound ---- */
const SND={ctx:null,
  tone(f,dur=.06,type='sine',vol=.18,f2){if(S.silent||S.volume<=0)return;try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();
    const c=this.ctx,t=c.currentTime,g=c.createGain();g.connect(c.destination);g.gain.setValueAtTime(vol*S.volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    [f,f2].filter(Boolean).forEach(fr=>{const o=c.createOscillator();o.type=type;o.frequency.value=fr;o.connect(g);o.start(t);o.stop(t+dur+.02)})}catch(e){}},
  click(){this.tone(1500,.025,'triangle',.05)},
  dtmf(k){const R={1:697,2:697,3:697,4:770,5:770,6:770,7:852,8:852,9:852,'*':941,0:941,'#':941},C={1:1209,2:1336,3:1477,4:1209,5:1336,6:1477,7:1209,8:1336,9:1477,'*':1209,0:1336,'#':1477};this.tone(R[k]||941,.14,'sine',.12,C[k]||1336)},
  ok(){this.tone(880,.08,'sine',.12);setTimeout(()=>this.tone(1320,.12,'sine',.12),90)},
  err(){this.tone(220,.18,'square',.06)}};

function dialog({title='',msg='',buttons=[{label:'حسناً'}],html=''}){return new Promise(res=>{
  const d=document.createElement('div');d.className='dlg';
  const many=buttons.length>2;
  d.innerHTML=`<div class="box">${title?`<h3>${esc(title)}</h3>`:''}${msg?`<p>${esc(msg)}</p>`:''}${html}<div class="${many?'col':buttons.length===2?'row2':'col'}">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
  d.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){dialog.last={};d.querySelectorAll('input,textarea').forEach(i=>{if(i.id)dialog.last[i.id]=i.value});d.remove();res(buttons[+b.dataset.i].value!==undefined?buttons[+b.dataset.i].value:+b.dataset.i)}else if(e.target===d){d.remove();res(null)}});
  SCREEN.appendChild(d);})}
const confirmDlg=(msg,ok='تأكيد',danger=true)=>dialog({msg,buttons:[{label:'إلغاء',value:false},{label:ok,cls:danger?'red':'blue',value:true}]});

/* ---- file pickers ---- */
function pickFile({accept='',capture='',multiple=false}={}){return new Promise(res=>{
  const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;if(capture)i.setAttribute('capture',capture);i.multiple=multiple;i.style.display='none';
  i.onchange=()=>{res([...i.files]);i.remove()};document.body.appendChild(i);i.click();
  setTimeout(()=>{if(!i.files||!i.files.length){/* user may still be choosing */}},0)})}
async function shrink(file,max=1600,q=.85){try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q))}catch(e){return file}}
async function toDataURL(file,max=256){const b=await shrink(file,max,.82);return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)})}

/* ---- page stacks inside apps ---- */
function Stack(host){const pages=[];const st={
  push(build,anim=true){const p=document.createElement('div');p.className='page'+(pages.length&&anim?' in':'');const prev=pages[pages.length-1];pages.push(p);host.appendChild(p);build(p,st);
    if(prev){if(anim){p.offsetWidth;requestAnimationFrame(()=>{p.classList.remove('in');prev.classList.add('under')})}else prev.classList.add('under')}return p},
  pop(){if(pages.length<2)return;const p=pages.pop();const prev=pages[pages.length-1];p.classList.add('in');prev.classList.remove('under');prev.dispatchEvent(new Event('reshow'));setTimeout(()=>p.remove(),330)},
  reset(build){pages.splice(0).forEach(p=>p.remove());return st.push(build,false)},
  top(){return pages[pages.length-1]},get depth(){return pages.length}};host._stack=st;return st}

/* ---- apps framework ---- */
const APPS={};let CURRENT=null;
function defApp(id,def){APPS[id]=def}
function sec(id){const a=APPS[id];if(!a.sec){const s=document.createElement('section');s.className='app';s.id='app-'+id;s.setAttribute('aria-label',a.name);$('#apps').appendChild(s);a.sec=s;a.build&&a.build(s)}return a.sec}
function openApp(id,arg){if(!APPS[id])return;if(!$('#lock').classList.contains('gone')||!$('#setup').hidden)return;
  closeCC();kbHide();
  if(CURRENT&&CURRENT!==id){const c=APPS[CURRENT];c.close&&c.close();c.sec&&c.sec.classList.remove('open')}
  const s=sec(id);s.classList.add('open');CURRENT=id;$('#home').classList.add('behind');
  setDark(!!APPS[id].light);APPS[id].open&&APPS[id].open(arg);applyChrome()}
function goHome(){kbHide();if($('#cc').classList.contains('on')){closeCC();return}
  if(CURRENT){const c=APPS[CURRENT];c.close&&c.close();c.sec&&c.sec.classList.remove('open')}
  CURRENT=null;$('#home').classList.remove('behind');setDark(false);applyChrome();renderHome()}
function setDark(d){$('#status').classList.toggle('dark',d);$('#homebar').classList.toggle('dark',d)}
let CHROME_HIDDEN=false;
function applyChrome(){const hide=CURRENT&&APPS[CURRENT].fullscreen&&APPS[CURRENT].fullscreen();CHROME_HIDDEN=!!hide;
  $('#status').classList.toggle('hide',!!hide);$('#pull').classList.toggle('thin',!!hide)}

function ccAct(k){SND.click();
  if(k==='air'){S.airplane=!S.airplane;if(S.airplane){S.wifi=false}else{S.wifi=true}hud(ICON.plane.replace('<svg','<svg width="34" height="34"'),S.airplane?'وضع الطيران: شغّال':'وضع الطيران: طافي')}
  else if(k==='cell'){if(S.airplane){toast('طفّ وضع الطيران أول');return}S.cell=!S.cell;toast(S.cell?'البيانات الخلوية شغّالة':'البيانات الخلوية طافية')}
  else if(k==='wifi'){S.wifi=!S.wifi;if(S.wifi&&!S.wifiNet&&S.known.length)S.wifiNet=S.known[0];toast(S.wifi?(S.wifiNet?'متصل بـ '+S.wifiNet:'الواي فاي شغّال'):'الواي فاي طافي')}
  else if(k==='silent'){S.silent=!S.silent;buzz(40);hud(S.silent?ICON.bellOff:ICON.bell,S.silent?'الصامت شغّال':'الصامت طافي')}
  else if(k==='rot'){setLand(!S.land);return}
  else if(k==='calc'){closeCC();openApp('calc');return}
  else if(k==='camera'){closeCC();openApp('camera');return}
  else if(k==='lock'){closeCC();lockNow();return}
  saveS();applyStatus();renderCC()}
(()=>{const cc=$('#cc');let drag=null,sy=0,moved=false;
  cc.addEventListener('click',e=>{const b=e.target.closest('[data-cc]');if(b){ccAct(b.dataset.cc);return}if(moved){moved=false;return}if(!e.target.closest('.ccslider,.ccconn'))closeCC()});
  cc.addEventListener('pointerdown',e=>{const sl=e.target.closest('[data-sl]');moved=false;if(sl){drag=sl;sl.setPointerCapture(e.pointerId);slide(e)}else{sy=lpt(e,SCREEN).y;drag='bg'}});
  cc.addEventListener('pointermove',e=>{if(drag&&drag!=='bg'){slide(e)}else if(drag==='bg'&&sy-lpt(e,SCREEN).y>60){drag=null;closeCC()}});
  addEventListener('pointerup',()=>{if(drag&&drag!=='bg'){saveS()}drag=null});

    if(drag.dataset.sl==='bright'){S.bright=Math.max(.15,v);applyStatus()}else{S.volume=v;if(v>0&&S.silent){}hud(ICON.speaker,'الصوت',v)}}

  const pull=$('#pull');let py=null;
  pull.addEventListener('pointerdown',e=>{py=lpt(e,SCREEN).y;pull.setPointerCapture(e.pointerId)});
  pull.addEventListener('pointermove',e=>{if(py!=null&&lpt(e,SCREEN).y-py>30){py=null;ccOpen()}});
  pull.addEventListener('pointerup',()=>{if(py!=null){py=null;ccOpen()}});

})();

function kbInsert(t){const el=KB.el;if(!el)return;let s=el.selectionStart,e=el.selectionEnd;if(s==null){el.value+=t}else{el.setRangeText(t,s,e,'end')}el.dispatchEvent(new Event('input',{bubbles:true}))}
function kbDel(){const el=KB.el;if(!el)return;let s=el.selectionStart,e=el.selectionEnd;if(s==null){el.value=el.value.slice(0,-1)}else if(s!==e){el.setRangeText('',s,e,'end')}else if(s>0){
  const before=el.value.slice(0,s);const n=Array.from(before).pop().length;el.setRangeText('',s-n,s,'end')}el.dispatchEvent(new Event('input',{bubbles:true}))}
(()=>{const kb=$('#kb');let rep=null;
  kb.addEventListener('pointerdown',e=>{e.preventDefault();const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;SND.click();

    kbInsert(KB.shift&&KB.lang==='en'?k.toUpperCase():k);if(KB.shift){KB.shift=false;renderKB()}});

  const isText=t=>t&&((t.tagName==='INPUT'&&/^(text|search|password|tel|url|email|)$/i.test(t.type))||t.tagName==='TEXTAREA');
  SCREEN.addEventListener('focusin',e=>{if(isText(e.target)&&!e.target.dataset.nokb)kbShow(e.target)});
  SCREEN.addEventListener('pointerdown',e=>{if(!$('#kb').classList.contains('on'))return;if(e.target.closest('#kb')||isText(e.target))return;kbHide()},true);
  const mark=root=>{(root.querySelectorAll?root.querySelectorAll('input,textarea'):[]).forEach(i=>{if(isText(i)&&!i.dataset.nokb){i.setAttribute('inputmode','none');i.setAttribute('autocomplete','off');i.setAttribute('autocorrect','off');i.setAttribute('autocapitalize','off');i.setAttribute('spellcheck','false')}})};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(isText(n))mark(n.parentNode);else mark(n)}}))).observe(SCREEN,{childList:true,subtree:true});
})();

/* ================= passcode pieces ================= */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jawwal:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'jawwal:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+h}}
const PINLET={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
function makePin(host,{title,sub='',len=null,onDone,extra=''}){
  let code='';
  host.innerHTML=`<div class="lockTitle">${esc(title)}</div><div class="lockSub">${esc(sub)}</div><div class="dots"></div>
   <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pk" data-p="${n}">${n}<small>${PINLET[n]||'&nbsp;'}</small></button>`).join('')}
   <button class="pk txt" data-p="ok" ${len?'style="visibility:hidden"':''}>التالي</button><button class="pk" data-p="0">0</button><button class="pk txt" data-p="del">حذف</button></div>${extra}`;
  const dots=host.querySelector('.dots');
  const draw=()=>{const n=len||Math.max(4,code.length+ (code.length<8?1:0));dots.innerHTML=Array.from({length:len||Math.max(4,code.length)},(_,i)=>`<i class="${i<code.length?'f':''}"></i>`).join('')};
  draw();
  const api={reset(msg){code='';draw();if(msg!=null){host.querySelector('.lockSub').textContent=msg}},fail(msg){dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');buzz(200);SND.err();api.reset(msg)}};
  host.querySelector('.pinpad').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p;SND.click();
    if(p==='del'){code=code.slice(0,-1);draw();return}
    if(p==='ok'){if(code.length<4){api.fail('الرمز لازم ٤ أرقام على الأقل');return}onDone(code,api);return}
    if(code.length>=(len||8))return;code+=p;draw();if(len&&code.length===len)setTimeout(()=>onDone(code,api),120)});
  return api}
function makePattern(host,{title,sub='',onDone,extra=''}){
  host.innerHTML=`<div class="lockTitle">${esc(title)}</div><div class="lockSub">${esc(sub)}</div>
   <svg class="patt" viewBox="0 0 300 300"><polyline class="pl" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><line class="cur" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".5"/>
   ${[0,1,2,3,4,5,6,7,8].map(i=>`<circle class="pd" data-i="${i}" cx="${50+(i%3)*100}" cy="${50+Math.floor(i/3)*100}" r="9" fill="#fff"/><circle class="ph" data-i="${i}" cx="${50+(i%3)*100}" cy="${50+Math.floor(i/3)*100}" r="26" fill="none" stroke="#fff" stroke-width="2" opacity="0"/>`).join('')}</svg>${extra}`;
  const svg=host.querySelector('svg'),pl=svg.querySelector('.pl'),cur=svg.querySelector('.cur');let seq=[],down=false;
  const P=i=>[50+(i%3)*100,50+Math.floor(i/3)*100];
  const color=c=>{pl.setAttribute('stroke',c);svg.querySelectorAll('.pd').forEach(d=>d.setAttribute('fill',seq.includes(+d.dataset.i)?c:'#fff'));svg.querySelectorAll('.ph').forEach(d=>{d.setAttribute('stroke',c);d.setAttribute('opacity',seq.includes(+d.dataset.i)?'.9':'0')})};
  const redraw=()=>{pl.setAttribute('points',seq.map(i=>P(i).join(',')).join(' '));color('#fff')};
  const pt=e=>{const p=lpt(e,svg);return[p.x*300/p.w,p.y*300/p.h]};
  const hit=([x,y])=>{for(let i=0;i<9;i++){const[a,b]=P(i);if(Math.hypot(a-x,b-y)<34&&!seq.includes(i)){
    const last=seq[seq.length-1];if(last!=null){const m=(last+i)/2;if(Number.isInteger(m)&&Math.abs(last%3-i%3)!==1&&Math.abs(Math.floor(last/3)-Math.floor(i/3))!==1&&!seq.includes(m))seq.push(m)}
    seq.push(i);SND.click();buzz(10);redraw();return}}};
  svg.addEventListener('pointerdown',e=>{e.preventDefault();down=true;seq=[];svg.setPointerCapture(e.pointerId);const p=pt(e);hit(p)});
  svg.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);hit(p);if(seq.length){const[a,b]=P(seq[seq.length-1]);cur.setAttribute('x1',a);cur.setAttribute('y1',b);cur.setAttribute('x2',p[0]);cur.setAttribute('y2',p[1])}});
  const up=()=>{if(!down)return;down=false;cur.removeAttribute('x1');cur.setAttribute('x2',0);cur.setAttribute('y2',0);cur.setAttribute('x1',0);cur.setAttribute('y1',0);
    if(!seq.length)return;if(seq.length<4){api.fail('وصّل ٤ نقاط على الأقل');return}onDone(seq.join(''),api)};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  const api={reset(msg){seq=[];redraw();if(msg!=null)host.querySelector('.lockSub').textContent=msg},
    ok(){color('#3fc77a')},
    fail(msg){color('#ff5d52');buzz(200);SND.err();svg.classList.remove('shake');void svg.offsetWidth;svg.classList.add('shake');host.querySelector('.lockSub').textContent=msg||'';setTimeout(()=>{seq=[];redraw()},650)}};
  return api}

/* choose type → set → confirm. Calls done({type,hash,len}) */
function passcodeFlow(stack,done){
  let type='pin';
  stack.push(p=>{p.innerHTML=`<div class="bar small">${stack.depth>1?backBtn():'<span></span>'}</div><div class="su" style="padding-top:10px">

    <div style="display:grid;gap:12px">
     <button class="choice on" data-t="pin"><span class="ci"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">${[0,1,2].map(r=>[0,1,2].map(c=>`<circle cx="${6+c*6}" cy="${6+r*6}" r="2"/>`).join('')).join('')}</svg></span><span><b>رمز رقمي</b><span>تكتب أرقام تختارها (٤ إلى ٨ أرقام)</span></span></button>
     <button class="choice" data-t="pattern"><span class="ci"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 5L19 5L5 19L19 19"/>${[5,12,19].map(y=>[5,12,19].map(x=>`<circle cx="${x}" cy="${y}" r="1.6" fill="#fff"/>`).join('')).join('')}</svg></span><span><b>نمط</b><span>ترسم خطوط بين النقاط، مثل حرف Z</span></span></button>
    </div><div class="foot"><button class="btn blue wide" data-next>التالي</button></div></div>`;
    p.addEventListener('click',e=>{const c=e.target.closest('[data-t]');if(c){type=c.dataset.t;$$('.choice',p).forEach(x=>x.classList.toggle('on',x===c));SND.click()}
      if(e.target.closest('[data-next]'))setStep()})});
  function setStep(){stack.push(p=>{p.innerHTML=`<div class="bar small">${backBtn()}</div><div class="su" style="padding-top:0;align-items:center"><div class="padhost" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%"></div></div>`;
    const host=p.querySelector('.padhost');
    if(type==='pin')makePin(host,{title:'اكتب الرمز اللي تبيه',sub:'من ٤ إلى ٨ أرقام، بعدين اضغط «التالي»',onDone:c=>confirmStep(c)});
    else makePattern(host,{title:'ارسم النمط اللي تبيه',sub:'وصّل ٤ نقاط على الأقل',onDone:(c,api)=>{api.ok();setTimeout(()=>confirmStep(c),350)}})})}
  function confirmStep(first){stack.push(p=>{p.innerHTML=`<div class="bar small">${backBtn()}</div><div class="su" style="padding-top:0;align-items:center"><div class="padhost" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%"></div></div>`;
    const host=p.querySelector('.padhost');
    const check=async(c,api)=>{if(c!==first){api.fail(type==='pin'?'الرمز ما يطابق، اكتبه مرة ثانية':'النمط ما يطابق، ارسمه مرة ثانية');return}
      api.ok&&api.ok();SND.ok();const hash=await sha(c);done({type,hash,len:type==='pin'?c.length:null})};
    if(type==='pin')makePin(host,{title:'اكتب الرمز مرة ثانية',sub:'للتأكيد',len:first.length,onDone:check});
    else makePattern(host,{title:'ارسم النمط مرة ثانية',sub:'للتأكيد',onDone:check})})}
}

const LANG_CODES='ar en fr es de tr ur fa hi bn id ms zh ja ko ru pt it nl sv no da fi pl uk cs sk hu ro bg el he th vi tl sw am so ha yo ig zu xh af sq hy az eu be bs ca hr et gl ka gu is ga kk km kn ky lo lv lt lb mk mg ml mt mi mr mn my ne ps pa sr si sl su tg ta tt te bo tk ug uz cy fy gd lb co eo ht haw la ln ny om or rw sm sn sd st ti to ts tn wo yi ceb dv ee ff fo fj gn kl ku mh nv oc qu rm rn sa sg sc se ss ve vo wa za ak bm ch ce cv dz gv ia ie ii ik io iu jv kg ki kj kr ks kv kw lg li lu na nd ng nr oj os pi sh tw ty'.split(' ');
let LANGS=null;
function langList(){if(LANGS)return LANGS;const seen=new Set();let arN;try{arN=new Intl.DisplayNames(['ar'],{type:'language'})}catch(e){arN=null}
  LANGS=LANG_CODES.filter(c=>!seen.has(c)&&seen.add(c)).map(c=>{let nat=c,ar=c;try{nat=new Intl.DisplayNames([c],{type:'language'}).of(c)||c}catch(e){}try{ar=arN?arN.of(c):c}catch(e){}
    return{c,nat:nat.charAt(0).toLocaleUpperCase(c)+nat.slice(1),ar}}).filter(l=>(l.ar&&l.ar!==l.c||l.nat!==l.c)&&!seen.has('n:'+l.ar)&&seen.add('n:'+l.ar));
  const top=LANGS.filter(l=>l.c==='ar'||l.c==='en');const rest=LANGS.filter(l=>l.c!=='ar'&&l.c!=='en').sort((a,b)=>a.ar.localeCompare(b.ar,'ar'));LANGS=[...top,...rest];return LANGS}
function langName(c){const l=langList().find(x=>x.c===c);return l?l.ar:c}
function langPicker(host,cur,onPick){

      f.classList.remove('bad');err.textContent='';draft.email=v;kbHide();SND.click();passcodeFlow(st,lk=>{ACCT={lang:draft.lang,email:draft.email,lock:lk,since:Date.now()};saveAcct();doneStep()})};

  const check=async(c,api)=>{if(await sha(c)===ACCT.lock.hash){api.ok&&api.ok();SND.ok();unlock()}else api.fail(ACCT.lock.type==='pin'?'رمز خطأ، جرّب مرة ثانية':'نمط خطأ، جرّب مرة ثانية')};
  if(ACCT.lock.type==='pin')makePin(pad,{title:'اكتب رمز الجوال',len:ACCT.lock.len,onDone:check,extra});
  else makePattern(pad,{title:'ارسم النمط عشان تفتح',onDone:check,extra});

  pad.querySelector('[data-forgot]').onclick=async()=>{

    if(v&&v===ACCT.email){toast('تم التحقق. اختر طريقة قفل جديدة');$('#lock').classList.add('gone');runSetup('lock')}else{SND.err();toast('الإيميل ما يطابق الإيميل المسجّل')}};

defApp('calc',{name:'الحاسبة',bg:G('#3a3a3c','#1c1c1e'),svg:SV.calc,
 build(s){s.innerHTML=`<div style="height:58px;flex:none"></div><div class="cdisp">0</div><div class="ckeys"></div>`;
  const KEYS=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],['.'],['=','op']];
  s.querySelector('.ckeys').innerHTML=KEYS.map(([k,c])=>`<button class="ck ${c||''}" data-k="${k}">${k}</button>`).join('');
  let cur='0',prev=null,op=null,fresh=false;
  const show=()=>{let t=cur;if(t.length>9&&t!=='خطأ'){const n=parseFloat(t);t=Math.abs(n)>=1e9||(Math.abs(n)<1e-6&&n!==0)?n.toExponential(3):String(+n.toPrecision(9))}
    const el=s.querySelector('.cdisp');el.textContent=t;el.style.fontSize=t.length>7&&!isLand()?'54px':'';
    s.querySelectorAll('.ck.op').forEach(b=>b.classList.toggle('on',b.dataset.k===op&&fresh));s.querySelector('[data-k="AC"]').textContent=cur!=='0'?'C':'AC'};
  const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b;
  s.querySelector('.ckeys').addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;SND.click();if(cur==='خطأ')cur='0';
    if(/\d/.test(k)){cur=fresh||cur==='0'?k:(cur.length<12?cur+k:cur);fresh=false}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){if(cur!=='0')cur='0';else{prev=null;op=null}}
    else if(k==='±')cur=String(-parseFloat(cur));
    else if(k==='%')cur=String(parseFloat(cur)/100);
    else if(k==='='){if(op!=null&&prev!=null){const r=calc(prev,parseFloat(cur),op);cur=isNaN(r)?'خطأ':String(+r.toPrecision(12));prev=null;op=null;fresh=true}}
    else{if(op&&prev!=null&&!fresh){const r=calc(prev,parseFloat(cur),op);cur=String(+r.toPrecision(12))}prev=parseFloat(cur);op=k;fresh=true}
    show()});
  show()}});

defApp('clock',{name:'الساعة',bg:G('#1c1c1e','#000'),svg:SV.clock,
 build(s){s.innerHTML=`<div class="bar"><h1>الساعة</h1></div><div class="body">
   <div class="seg"><button class="on" data-cv="now">الوقت الآن</button><button data-cv="sw">ساعة الإيقاف</button></div>
   <div data-v="now"><div class="bigtime">--:--:--</div><div class="dates"><b class="cd"></b><br><span class="cg"></span><br><span class="ch"></span></div></div>
   <div data-v="sw" hidden><div class="sw">00:00.00</div><div class="swb"><button class="round" data-lap>دورة</button><button class="round go" data-go>ابدأ</button></div><div class="laps"></div></div></div>`;
  s.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{s.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));s.querySelectorAll('[data-v]').forEach(v=>v.hidden=v.dataset.v!==b.dataset.cv)});
  const fT=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  TICKS.push(d=>{if(CURRENT!=='clock')return;s.querySelector('.bigtime').textContent=fT.format(d);s.querySelector('.cd').textContent=fmtDay.format(d);s.querySelector('.cg').textContent=fmtG.format(d);s.querySelector('.ch').textContent=fmtH.format(d)});
  let st=0,acc=0,run=false,laps=[];const f=ms=>{const m=Math.floor(ms/60000),x=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}.${String(c).padStart(2,'0')}`};
  const now=()=>acc+(run?performance.now()-st:0);const loop=()=>{s.querySelector('.sw').textContent=f(now());if(run)requestAnimationFrame(loop)};
  const go=s.querySelector('[data-go]'),lap=s.querySelector('[data-lap]');
  go.onclick=()=>{SND.click();if(run){acc=now();run=false;go.textContent='ابدأ';go.className='round go';lap.textContent='تصفير'}else{st=performance.now();run=true;go.textContent='إيقاف';go.className='round stop';lap.textContent='دورة';loop()}};
  lap.onclick=()=>{SND.click();if(run)laps.unshift(now());else{acc=0;laps=[];s.querySelector('.sw').textContent=f(0)}
    s.querySelector('.laps').innerHTML=laps.map((t,i)=>`<div><span>دورة ${AD(laps.length-i)}</span><span>${f(t-(laps[i+1]||0))}</span></div>`).join('')}},
 open(){tick()}});

defApp('snake',{name:'ثعبان',bg:G('#3fae4f','#145c2a'),svg:SV.snake,
 build(s){s.innerHTML=`<div class="bar"><h1>ثعبان</h1><button class="btn acc" data-go>ابدأ</button></div><div class="body">
   <div class="score"><span>النقاط <b data-s>0</b></span><span>أعلى نتيجة <b data-b>0</b></span></div><canvas class="snakeC" width="300" height="300"></canvas>
   <div class="pad"><button class="u" data-d="u" aria-label="فوق">▲</button><button class="l" data-d="l" aria-label="يسار">◀</button><button class="d" data-d="d" aria-label="تحت">▼</button><button class="r" data-d="r" aria-label="يمين">▶</button></div></div>`;
  const c=s.querySelector('canvas'),x=c.getContext('2d'),N=15,CS=20;let sn,dir,nd,food,tm=null,sc=0,best=LS.get('snakeBest',0),alive=false;s.querySelector('[data-b]').textContent=best;
  const reset=()=>{sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir={x:1,y:0};nd=dir;sc=0;s.querySelector('[data-s]').textContent=0;place()};
  const place=()=>{do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(q=>q.x===food.x&&q.y===food.y))};
  const draw=m=>{x.fillStyle='#12201a';x.fillRect(0,0,300,300);x.fillStyle='#17291f';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)x.fillRect(i*CS,j*CS,CS,CS);
    x.fillStyle='#ff5d52';x.beginPath();x.arc(food.x*CS+10,food.y*CS+10,7,0,7);x.fill();
    sn.forEach((q,i)=>{x.fillStyle=i?'#7ed957':'#c6ff9e';x.beginPath();x.roundRect?x.roundRect(q.x*CS+1,q.y*CS+1,18,18,5):x.rect(q.x*CS+1,q.y*CS+1,18,18);x.fill()});
    if(m){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,300,300);x.fillStyle='#fff';x.font='600 22px "Readex Pro",sans-serif';x.textAlign='center';x.fillText(m,150,155)}};
  const stop=()=>{clearInterval(tm);tm=null};this.stop=stop;
  const step=()=>{dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(q=>q.x===h.x&&q.y===h.y)){stop();alive=false;SND.err();if(sc>best){best=sc;LS.set('snakeBest',best);s.querySelector('[data-b]').textContent=best}draw('خسرت! اضغط ابدأ');s.querySelector('[data-go]').textContent='مرة ثانية';return}
    sn.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;SND.tone(990,.06);s.querySelector('[data-s]').textContent=sc;place();stop();tm=setInterval(step,Math.max(70,150-sc*4))}else sn.pop();draw()};
  s.querySelector('[data-go]').onclick=()=>{stop();reset();alive=true;s.querySelector('[data-go]').textContent='من جديد';draw();tm=setInterval(step,150)};
  const D={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};const turn=k=>{const n=D[k];if(n&&!(n.x===-dir.x&&n.y===-dir.y))nd=n};
  s.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>turn(b.dataset.d));
  addEventListener('keydown',e=>{if(CURRENT!=='snake')return;const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();turn(m)}});
  let t0=null;c.addEventListener('pointerdown',e=>{t0=lpt(e,SCREEN)});c.addEventListener('pointerup',e=>{if(!t0)return;const t=lpt(e,SCREEN),dx=t.x-t0.x,dy=t.y-t0.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));t0=null});
  reset();draw('اضغط ابدأ')},
 close(){this.stop&&this.stop()}});

defApp('xo',{name:'إكس أو',bg:G('#4a2f6e','#1f1530'),svg:SV.xo,
 build(s){s.innerHTML=`<div class="bar"><h1>إكس أو</h1><button class="btn" data-new>جولة جديدة</button></div><div class="body">
   <div class="score"><span>أنت (X) <b data-w>0</b></span><span>تعادل <b data-d>0</b></span><span>الجوال (O) <b data-l>0</b></span></div><div class="xog"></div><div class="xostat">دورك، العب</div></div>`;
  let b,over,xs=LS.get('xo',{w:0,d:0,l:0});const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=q=>{for(const[a,c,d]of L)if(q[a]&&q[a]===q[c]&&q[a]===q[d])return q[a];return q.every(Boolean)?'D':null};
  const mm=(q,p)=>{const w=win(q);if(w==='O')return{s:1};if(w==='X')return{s:-1};if(w==='D')return{s:0};let best=null;q.forEach((v,i)=>{if(v)return;q[i]=p;const r=mm(q,p==='O'?'X':'O');q[i]=null;if(!best||(p==='O'?r.s>best.s:r.s<best.s))best={s:r.s,i}});return best};
  const render=()=>{s.querySelector('.xog').innerHTML=b.map((v,i)=>`<button class="xoc ${v?v.toLowerCase():''}" data-i="${i}" aria-label="خانة ${i+1}">${v||''}</button>`).join('');s.querySelector('[data-w]').textContent=xs.w;s.querySelector('[data-d]').textContent=xs.d;s.querySelector('[data-l]').textContent=xs.l};
  const end=w=>{over=true;if(w==='X'){xs.w++;SND.ok();s.querySelector('.xostat').textContent='فزت!'}else if(w==='O'){xs.l++;s.querySelector('.xostat').textContent='الجوال فاز عليك'}else{xs.d++;s.querySelector('.xostat').textContent='تعادل'}LS.set('xo',xs);render()};
  const nw=()=>{b=Array(9).fill(null);over=false;s.querySelector('.xostat').textContent='دورك، العب';render()};
  s.querySelector('.xog').addEventListener('click',e=>{const c=e.target.closest('[data-i]');if(!c||over)return;const i=+c.dataset.i;if(b[i])return;SND.click();b[i]='X';let w=win(b);if(w)return end(w);
    const em=b.map((v,j)=>v?null:j).filter(v=>v!=null);const pk=Math.random()<.2?em[Math.floor(Math.random()*em.length)]:mm(b,'O').i;b[pk]='O';w=win(b);render();if(w)end(w)});
  s.querySelector('[data-new]').onclick=nw;nw()}});

function pickFromAlbum(){return new Promise(async res=>{const ids=LS.get('photos',[]);const items=[];for(const id of ids){const it=await IDB.get('photo:'+id);if(it&&!(it.type||'').startsWith('video'))items.push([id,await blobURL('photo:'+id)])}

function pickFromFiles(kind){return new Promise(async res=>{const L=LS.get('files',[]).filter(f=>!kind||(f.type||'').startsWith(kind));const rows=[];for(const f of L){rows.push([f,(f.type||'').startsWith('image')?await blobURL('file:'+f.id):null])}

};

  SCREEN.appendChild(n);requestAnimationFrame(()=>n.classList.add('on'));

/* ================= REAL CALLS (between phones that have this page open) ================= */
const RTC={room:null,peers:[],cs:null,msgs:[],seen:new Set(),call:null,ring:null,ok:false};
(async()=>{try{if(window.claude&&window.claude.use){const r=await window.claude.use('room');if(!r)return;RTC.room=r;RTC.ok=true;
  r.onPeers(ch=>{RTC.peers=ch.peers;RTC.update()},()=>{RTC.ok=false});RTC.pub()}}catch(e){}})();
RTC.me=()=>LS.get('me',null)||{};
RTC.pub=function(){if(!this.room)return;const me=this.me();
  const p={app:'jw1',n:me.number||null,nm:me.name?String(me.name).slice(0,30):null,av:me.avatar&&me.avatar.t==='ani'?me.avatar.v:null,g:me.gender||null,c:this.cs,m:this.msgs.slice(-5)};
  this.room.presence(p).catch(()=>{})};
RTC.others=function(){return this.peers.filter(p=>!p.sameTab&&p.presence&&p.presence.app==='jw1')};
RTC.find=function(num){return this.others().find(p=>p.presence.n===num)};
RTC.online=function(num){return !!this.find(num)};
RTC.update=function(){const me=this.me();
  // incoming
  if(me.number&&!this.call){for(const p of this.others()){const c=p.presence.c;if(c&&c.to===me.number&&c.st==='ring'&&!this.seen.has(c.id)){this.seen.add(c.id);this.incoming(p,c);break}}}
  // ringing caller hung up
  if(this.call&&this.call.dir==='in'&&this.call.st==='ring'){const p=this.peers.find(x=>x.peer===this.call.peer);const c=p&&p.presence.c;if(!c||c.id!==this.call.id||c.st!=='ring'){this.missed()}}
  if(this.call){const p=this.peers.find(x=>x.peer===this.call.peer);const c=p&&p.presence.c;
    if(this.call.dir==='out'&&this.call.st==='ring'&&c&&c.id===this.call.id){if(c.st==='ans')this.connected();else if(c.st==='dec')this.ended('رفض المكالمة');}
    if(this.call&&this.call.st==='talk'){if(!p||!c||c.id!==this.call.id||c.st==='end')this.ended('انتهت المكالمة');else this.readMsgs(p)}}
  APPS.phone&&APPS.phone.sec&&CURRENT==='phone'&&APPS.phone.refreshOnline&&APPS.phone.refreshOnline()};
RTC.setCS=function(cs){this.cs=cs;this.pub()};
RTC.dial=function(c){const me=this.me();const host=SCREEN;
  if(!me.number){dialog({title:'ما عندك رقم',msg:'أنشئ رقمك أول من تطبيق «الهاتف»، بعدين تقدر تتصل.',buttons:[{label:'حسناً'}]});return}
  if(S.airplane){this.screen({name:c.name,num:c.number,av:c.avatar,g:c.gender},'وضع الطيران شغّال. طفّه عشان تتصل',true);return}
  if(!S.cell){this.screen({name:c.name,num:c.number,av:c.avatar,g:c.gender},'لا توجد خدمة. شغّل الشبكة الخلوية',true);return}
  if(c.number===me.number){this.screen({name:c.name,num:c.number},'ما تقدر تتصل على رقمك',true);return}
  if(CREDIT.get()<1){this.screen({name:c.name,num:c.number,av:c.avatar,g:c.gender},'رصيد المكالمات خلص. اشحن من «اشحنو نتو»',true);return}

/* ---- peer.js ---- */
/* ================= calls outside Claude: peer-to-peer (PeerJS + WebRTC, real voice) ================= */
(function(){
if(!STANDALONE)return;
const PR={peer:null,id:null,ready:false,conn:null,local:null,media:null,pending:null,audio:null};
const PID=n=>'jawwal-sa-v1-'+String(n).replace(/\D/g,'');
const STUN=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
/* free public TURN relay (Open Relay, static-auth): lets calls connect on mobile networks where a direct link is blocked */
async function turnServers(){try{const user=(Math.floor(Date.now()/1000)+86400)+':jawwal';const key=await crypto.subtle.importKey('raw',new TextEncoder().encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(user)));const cred=btoa(String.fromCharCode(...sig));const h='staticauth.openrelay.metered.ca';
  return[{urls:['turn:'+h+':80','turn:'+h+':80?transport=tcp','turn:'+h+':443','turns:'+h+':443?transport=tcp'],username:user,credential:cred}]}catch(e){return[]}}
PR.state='off';
function setState(st){PR.state=st;RTC.ok=st==='on';const el=document.querySelector('[data-netstate]');if(el)el.outerHTML=netStateHTML()}
window.__jwNetState=()=>PR.state;
let starting=false;async function start(){const me=RTC.me();if(!me.number||typeof Peer==='undefined'){setState(typeof Peer==='undefined'?'nolib':'off');return}if(!navigator.onLine){setState('offline');return}const id=PID(me.number);if(starting)return;
  if(PR.peer&&PR.id===id&&!PR.peer.destroyed)return;if(PR.peer){try{PR.peer.destroy()}catch(e){}}
  starting=true;setState('connecting');const turn=await turnServers();starting=false;
  PR.id=id;PR.ready=false;let p;try{p=new Peer(id,{debug:0,config:{iceServers:[...STUN,...turn],iceTransportPolicy:'all'}})}catch(e){setState('error');return}PR.peer=p;
  p.on('open',()=>{PR.ready=true;setState('on')});
  p.on('disconnected',()=>{PR.ready=false;setState('connecting');setTimeout(()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}},2500)});
  p.on('error',e=>{const t=e&&e.type;
    if(t==='peer-unavailable'){PR.onUnavail&&PR.onUnavail();return}
    if(t==='unavailable-id'){PR.ready=false;setState('taken');setTimeout(()=>{if(PR.peer===p){PR.peer=null;start()}},8000);return}
    if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){PR.ready=false;setState('connecting');setTimeout(()=>{if(PR.peer===p){PR.peer=null;start()}},5000)}});
  p.on('connection',conn=>{conn.on('data',d=>onData(conn,d));conn.on('close',()=>{if(PR.conn===conn&&RTC.call){if(RTC.call.dir==='in'&&RTC.call.st==='ring')RTC.missed();else RTC.ended('انتهت المكالمة')}})});
  p.on('call',call=>{if(RTC.call&&RTC.call.st==='talk'&&PR.local!==undefined){answerMedia(call)}else PR.pending=call});}

function unlockAudio(){if(!PR.audio){PR.audio=document.createElement('audio');PR.audio.autoplay=true;PR.audio.setAttribute('playsinline','');document.body.appendChild(PR.audio)}try{PR.audio.play().catch(()=>{})}catch(e){}}
function hook(call){PR.media=call;call.on('stream',s=>{unlockAudio();PR.audio.srcObject=s;PR.audio.play().catch(()=>{});RTC.voice=true;RTC.renderChat()});call.on('close',()=>{})}

function cleanup(){try{PR.media&&PR.media.close()}catch(e){}PR.media=null;try{PR.pending&&PR.pending.close()}catch(e){}PR.pending=null;
  if(PR.local){PR.local.getTracks().forEach(t=>t.stop());PR.local=null}if(PR.audio)PR.audio.srcObject=null;RTC.voice=false;
  const c=PR.conn;PR.conn=null;setTimeout(()=>{try{c&&c.close()}catch(e){}},800)}

    PR.conn=conn;const C=LS.get('contacts',[]).find(x=>x.number===d.n);
    RTC.call={id:String(d.id),dir:'in',peer:null,num:String(d.n||''),name:C?C.name:(String(d.nm||'').slice(0,30)||fmtNum(d.n)),av:C?C.avatar:(d.av?{t:'ani',v:String(d.av).slice(0,4)}:null),g:C?C.gender:d.g,st:'ring'};

    if(CURRENT&&!locked){RTC.banner=notify('phone','الهاتف',`${RTC.call.name} يتصل عليك`,{sticky:true,actions:[{label:'رفض',cls:'red',fn:()=>RTC.decline()},{label:'رد',cls:'green',fn:()=>RTC.answer()}],onTap:()=>RTC.callUI()})}
    else RTC.callUI();return}
  const c=RTC.call;if(!c||String(d.id)!==c.id)return;
  if(d.t==='ans'&&c.dir==='out'&&c.st==='ring'){if(!LS.get('contacts',[]).some(x=>x.number===c.num)){if(d.nm)c.name=String(d.nm).slice(0,30);if(d.av)c.av={t:'ani',v:String(d.av).slice(0,4)};c.g=d.g||c.g}RTC.connected();mic().then(s=>{if(!RTC.call||RTC.call.id!==c.id)return;try{const call=PR.peer.call(PID(c.num),s||undefined);if(call)hook(call)}catch(e){}});return}

  if(d.t==='msg'){const t=String(d.text||'').slice(0,140);(c.chat=c.chat||[]).push({me:0,t});RTC.say(t);RTC.renderChat()}}

  if(!me.number){dialog({title:'ما عندك رقم',msg:'أنشئ رقمك أول من تطبيق «الهاتف»، بعدين تقدر تتصل.',buttons:[{label:'حسناً'}]});return}

  if(S.airplane){this.screen(who,'وضع الطيران شغّال. طفّه عشان تتصل',true);return}
  if(!S.cell){this.screen(who,'لا توجد خدمة. شغّل الشبكة الخلوية',true);return}
  if(c.number===me.number){this.screen(who,'ما تقدر تتصل على رقمك',true);return}
  if(CREDIT.get()<1){this.screen(who,'رصيد المكالمات خلص. اشحن من «اشحنو نتو»',true);return}
